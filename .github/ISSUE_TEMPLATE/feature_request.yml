name: Feature request
description: Propose a new workflow or improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who has the problem and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Examples, evidence, or references
      description: Do not include confidential personal or candidate data.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and privacy check
      options:
        - label: This proposal does not require scraping, unauthorized platform automation, or automated hiring decisions.
          required: true
